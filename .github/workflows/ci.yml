# CI: lint, type-check, testes (com Postgres de serviço) e build.
# O job de deploy no Azure Web App só roda se o secret AZURE_WEBAPP_PUBLISH_PROFILE
# estiver configurado no repositório (Settings > Secrets > Actions).
#
# Para configurar o deploy:
# 1. Crie o Azure Web App e baixe o Publish Profile.
# 2. Crie o secret AZURE_WEBAPP_PUBLISH_PROFILE no repositório com o conteúdo do arquivo.
# 3. Ajuste AZURE_WEBAPP_NAME abaixo para o nome do seu Web App.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: your-app-name
  NODE_VERSION: "20.x"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adega
          POSTGRES_PASSWORD: adega
          POSTGRES_DB: adega
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://adega:adega@localhost:5432/adega?schema=public
      TEST_DATABASE_URL: postgresql://adega:adega@localhost:5432/adega_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test
        env:
          PGPASSWORD: adega

      - name: Build
        run: npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: "Development"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: "Deploy to Azure WebApp"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
